name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    # Shared org gate (flipslidersand-labs/qa-workflows). Runner is resolved
    # inside the reusable workflow via vars.GATE_RUNNER.
    uses: flipslidersand-labs/qa-workflows/.github/workflows/python-test.yml@main
    with:
      python-version: "3.12"
      install-extras: dev
      test-path: tests/
      # pyproject addopts already enforce --cov-fail-under=60; keep the same bar.
      coverage-threshold: 60
      # Previous CI ran black --check non-blocking (|| echo); ruff is not
      # configured for this repo yet, so lint stays off for the first rollout.
      run-lint: false
